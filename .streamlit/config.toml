# Kuku TV palette (from kukutv.app): black, white, orange #E25506, gold #FFBB10, Figtree
[theme]
base = "dark"
primaryColor = "#E25506"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1A1A1A"
textColor = "#FFFFFF"
borderColor = "#2A2A2A"
linkColor = "#FF641C"
font = "sans-serif"   # Figtree is loaded by app.py CSS
codeFont = "monospace"
chartCategoricalColors = ["#E25506", "#FFBB10", "#9CA3AF"]

[server]
headless = true
