# Kuku FM palette (from kukufm.com): black, white, red #EB0000 for actions, gold #FFBB10, Figtree
[theme]
base = "dark"
primaryColor = "#EB0000"
backgroundColor = "#000000"
secondaryBackgroundColor = "#141414"
textColor = "#FFFFFF"
borderColor = "#262626"
linkColor = "#FFFFFF"
font = "sans-serif"   # Figtree is loaded by app.py CSS
codeFont = "monospace"
chartCategoricalColors = ["#EB0000", "#FFBB10", "#7C7C85"]

[server]
headless = true
